<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>Für Sonja</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#fff6f8;color:#4a3740;font-family:Arial,Helvetica,sans-serif}
.card{width:min(650px,100%);background:#fff;border:1px solid #f1cbd5;border-radius:14px;padding:42px 36px}
h1{margin:0 0 32px;color:#b85f79;font-size:30px;font-weight:600;animation:fade 1.2s ease-out both}
p{margin:0 0 22px;font-size:20px;line-height:1.65}.quote{color:#9f4f68;font-size:23px;font-weight:700}.answer{color:#9f4f68;font-weight:700}.sign{margin-top:34px;font-size:20px}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:600px){.card{padding:32px 24px}p{font-size:18px}.quote{font-size:21px}}
</style></head><body><main class="card">
<h1>Hallo Sonja 🫂</h1>
<p>Du hast einmal zu mir gesagt:</p>
<p class="quote">„Es war kein Zufall, dass wir uns begegnet sind.“</p>
<p class="answer">Ich denke genauso.</p>
<p>Du weißt, wie du mich erreichst.</p>
<p class="sign">Manni 🫂</p>
</main></body></html>
